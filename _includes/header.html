<header class="site-header" role="banner">
  <div class="wrapper">
    <a class="site-title" rel="author" href="{{ "/" | relative_url }}">{{ site.title | escape }}</a>
    <nav class="site-nav">
      <input type="checkbox" id="nav-trigger" class="nav-trigger" />
      <label for="nav-trigger">
        <span class="menu-icon">
          <svg viewBox="0 0 18 15" width="18px" height="15px">
            <path d="M18,1.484c0,0.82-0.665,1.484-1.484,1.484H1.484C0.665,2.969,0,2.304,0,1.484
            C0,0.665,0.665,0,1.484,0h15.031C17.335,0,18,0.665,18,1.484z M18,7.516
            c0,0.82-0.665,1.484-1.484,1.484H1.484C0.665,9,0,8.335,0,7.516
            s0.665-1.484,1.484-1.484h15.031C17.335,6.031,18,6.696,18,7.516z M18,13.516
            C18,14.335,17.335,15,16.516,15H1.484C0.665,15,0,14.335,0,13.516
            s0.665-1.484,1.484-1.484h15.031C17.335,12.031,18,12.696,18,13.516z"/>
          </svg>
        </span>
      </label>
      <div class="trigger">
        {% if site.nav_links %}
          {% for link in site.nav_links %}
            <a class="page-link" href="{{ link.url | relative_url }}">{{ link.title }}</a>
          {% endfor %}
        {% endif %}
      </div>
    </nav>
  </div>
</header>
