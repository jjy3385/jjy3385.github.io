<!-- Giscus comments & reactions. Configure your repo at https://giscus.app -->
<!-- 1) Enable "Discussions" on your GitHub repo -->
<!-- 2) Visit https://giscus.app, select your repo, copy repo-id/category-id, and fill below -->
<div id="comments">
  <script src="https://giscus.app/client.js"
          data-repo="YOUR_GISCUS_REPO"               <!-- e.g., yourname/yourrepo -->
          data-repo-id="YOUR_GISCUS_REPO_ID"
          data-category="General"                     <!-- or the category you choose -->
          data-category-id="YOUR_GISCUS_CATEGORY_ID"
          data-mapping="pathname"
          data-strict="0"
          data-reactions-enabled="1"                  <!-- 👍❤️🎉 등 리액션(좋아요) 활성화 -->
          data-emit-metadata="0"
          data-input-position="bottom"
          data-theme="preferred_color_scheme"
          data-lang="ko"
          crossorigin="anonymous"
          async>
  </script>
  <noscript>댓글을 보려면 자바스크립트가 필요합니다.</noscript>
</div>
